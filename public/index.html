<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ULTRON</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ff2a14%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="fx scanlines"></div>
    <div class="fx vignette"></div>

    <header class="hud">
      <div class="brand">ULTRON <span>// v.2.0</span></div>
      <div class="status"><i id="statusDot"></i><span id="statusText">DORMINDO</span></div>
    </header>

    <button id="logToggle" class="ghost" title="Histórico">HISTÓRICO</button>
    <aside id="log" class="log hidden"></aside>

    <section class="subtitle" id="subtitle" aria-live="polite"></section>

    <form id="composer" class="composer">
      <button type="button" id="mic" class="mic" title="Falar (segure espaço)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <input id="text" autocomplete="off" placeholder="Fale com o Ultron…" />
      <label class="toggle" title="Depois que ele responder, volta a ouvir sozinho">
        <input type="checkbox" id="handsFree" checked />
        <span>MÃOS LIVRES</span>
      </label>
      <button type="submit" class="send">ENVIAR</button>
    </form>

    <div id="boot" class="boot">
      <div class="boot-inner">
        <div class="boot-title">ULTRON</div>
        <p>Sistema em hibernação. Autorização necessária.</p>
        <button id="wake">DESPERTAR</button>
        <small>Use Chrome ou Edge para conversar por voz.</small>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>

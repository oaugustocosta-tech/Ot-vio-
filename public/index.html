<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JARVIS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ff8a1f%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="frame" aria-hidden="true">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <i class="bar top"></i><i class="bar left"></i><i class="bar right"></i>
    </div>
    <div class="readout" id="readout" aria-live="off"></div>

    <header class="hud">
      <div class="brand">J.A.R.V.I.S.</div>
      <div class="status"><i id="statusDot"></i><span id="statusText">offline</span></div>
    </header>

    <button id="chatToggle" class="ghost" aria-pressed="false" title="Mostrar a conversa escrita">Chat</button>
    <aside class="chatbox" aria-label="Conversa escrita">
      <div id="log" class="log"></div>
      <form id="composer" class="composer">
        <input id="text" autocomplete="off" placeholder="Digite para o Jarvis…" />
        <button type="submit" class="send">Enviar</button>
      </form>
    </aside>

    <div id="toast" class="toast" role="status"></div>

    <div id="boot" class="boot">
      <div class="boot-inner">
        <div class="boot-title">J.A.R.V.I.S.</div>
        <button id="wake">Despertar</button>
        <small>Depois, é só dizer "Jarvis" para chamar. Clicar no reator também chama.</small>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
